version: 2

models:
  - name: daily_segment_prices
    description: >
      Day x platform x segment (model + storage + condition, plan 8.2): offer count and the price distribution in lira
      and dollars, in-stock offers only. Permanent (`full_refresh` false); the last `lookback_days` days are computed
      again on every run. The Power BI model and the Streamlit market page read it.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, platform, segment_id]
    columns:
      - name: snapshot_date
        description: Turkish calendar day.
        data_tests: [not_null]
      - name: platform
      - name: segment_id
        description: Device and condition, e.g. "iPhone 13 128 GB · Mükemmel".
        data_tests: [not_null]
      - name: segment_basis
        description: raw (the platform's condition label) or common (the shared scale); one basis per table.
      - name: device_id
        description: Model and storage, the key of core.dim_device.
      - name: model
      - name: storage_gb
      - name: segment_condition
        description: The condition part of the segment.
      - name: condition_level
        description: Level of the condition on the shared scale, 4 (Mükemmel) to 1 (Outlet).
      - name: generation
      - name: series
      - name: release_date
        description: US release of the model.
      - name: device_age_days
        description: Days since the model's US release.
      - name: us_launch_price_usd
        description: US launch price of the device (K29).
      - name: offer_count
        description: In-stock offers (one per variant and seller).
        data_tests:
          - expression_is_true:
              arguments:
                expression: offer_count > 0
      - name: seller_count
      - name: platform_offer_count
        description: Offers sold by the platform itself.
      - name: stock_units
        description: Units in stock over the offers.
      - name: median_price_tl
        data_tests: [not_null]
      - name: p25_price_tl
      - name: p75_price_tl
      - name: min_price_tl
      - name: max_price_tl
      - name: median_price_usd
        data_tests: [not_null]
      - name: min_price_usd
      - name: max_price_usd
      - name: usd_try
        description: TCMB rate the dollar prices use (plan 5.4).
      - name: fx_confirmed
        description: The rate is final (a later bulletin is stored).
      - name: computed_at
        description: When the row was last computed.

  - name: daily_market
    description: Day x platform overview of the whole market (in-stock offers), for KPI cards. Permanent, with the same lookback as daily_segment_prices.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, platform]
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: platform
      - name: offer_count
      - name: seller_count
      - name: model_count
      - name: device_count
        description: Distinct model and storage pairs.
      - name: segment_count
      - name: platform_offer_count
        description: Offers sold by the platform itself.
      - name: stock_units
      - name: median_price_tl
        description: Median over all offers of the day; it moves with the mix of models on sale, not only with prices.
      - name: median_price_usd
      - name: discounted_offer_count
        description: Offers with a discount shown on the page (`promo_pct` above 0).
      - name: usd_try
      - name: fx_confirmed
      - name: computed_at

  - name: daily_condition_premiums
    description: >
      Day x platform x condition (A2): the price a seller asks for a condition against its own offer of the
      reference condition (Mükemmel) for the same model and storage on the same day, so the seller mix stays out of
      the comparison. Seller groups: all, platform (the platform's own offers), others. Permanent, with the usual
      lookback.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, platform, condition_raw, seller_group]
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: platform
      - name: condition_raw
        description: The condition compared, the platform's own label.
      - name: seller_group
        data_tests:
          - accepted_values:
              arguments:
                values: [all, platform, others]
      - name: reference_condition
        description: The condition it is compared with (var reference_condition).
      - name: pairs
        description: Seller x device pairs with both conditions in stock that day.
      - name: sellers
      - name: devices
        description: Model and storage pairs compared.
      - name: median_difference_pct
        description: Median of the sellers' price of the condition over their price of the reference condition, minus 1, in percent.
        data_tests: [not_null]
      - name: p25_difference_pct
      - name: p75_difference_pct
      - name: computed_at

  - name: daily_seller_positions
    description: >
      Day x platform x seller (A3): where a seller prices against the other sellers of the same segment. A seller's
      price in a segment is the median over its offers there; its position is that price over the median of the
      sellers' prices in the segment, minus 1. Only segments with at least `position_min_sellers` sellers are
      compared. Seller numeric ids only: a published page shows anonymous labels (K22). Permanent, with the usual
      lookback.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, platform, seller_key]
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: platform
      - name: seller_key
        description: "`{platform}:{seller id}`; no seller names (K22)."
        data_tests: [not_null]
      - name: seller_is_platform
        description: The platform's own store.
      - name: offer_count
        description: In-stock offers of the seller that day.
      - name: segment_count
        description: Segments the seller has in-stock offers in.
      - name: compared_segment_count
        description: Of them, segments with at least `position_min_sellers` sellers.
        data_tests:
          - expression_is_true:
              arguments:
                expression: compared_segment_count <= segment_count
      - name: median_position_pct
        description: Median over the compared segments of the seller's price over the segment's median seller price, minus 1, in percent. Empty when no segment is compared.
      - name: p25_position_pct
      - name: p75_position_pct
      - name: below_median_count
        description: Compared segments where the seller is below the median seller.
      - name: above_median_count
      - name: cheapest_count
        description: Compared segments where the seller is the cheapest (ties count for each).
      - name: computed_at

  - name: offer_lifecycle
    description: >
      One row per offer (variant and seller) over its whole life (plan 8.3): first and last day, first and last
      price, price changes, days seen. Permanent: each run merges an offer's new days into its row, because the raw
      detail behind the figures is deleted after 90 days. An offer missing on some days keeps its row; the gap is
      `last_seen - first_seen + 1 - days_seen` days.
    columns:
      - name: offer_key
        data_tests: [unique, not_null]
      - name: platform
      - name: variant_id
      - name: seller_key
        description: "`{platform}:{seller id}`; no seller names (K22)."
      - name: seller_is_platform
        description: Sold by the platform itself.
      - name: device_id
      - name: model
      - name: storage_gb
      - name: color
      - name: sim_type
      - name: condition_raw
      - name: segment_id
        description: Segment on the offer's first day.
      - name: first_seen
        data_tests: [not_null]
      - name: last_seen
        data_tests: [not_null]
      - name: days_seen
        description: Days the offer was seen in stock.
      - name: first_price_tl
      - name: last_price_tl
      - name: min_price_tl
      - name: max_price_tl
      - name: price_change_count
        description: Times the price differed from the offer's previous day seen.
      - name: price_cut_count
        description: The changes that lowered the price.
      - name: updated_at
        description: When the row was last merged.

  - name: price_index_basket
    description: >
      The baskets of the price index (plan 10.3), one row per basket and segment. The first basket is the base
      period's; from `index_renewal_start` a new one takes over on the first day of every month, chosen from the month
      before it, so that newly launched models enter the index. A basket holds the segments priced on at least
      `index_min_day_share` of its reference period's days with at least `index_min_offers` offers a day on average,
      weighted by their share of the period's offers. `final` turns true once the period's days are no longer
      computed again.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, basket_start, segment_id]
    columns:
      - name: platform
      - name: basket_start
        description: First day the basket prices (the base period's first day, then the first day of a month).
        data_tests: [not_null]
      - name: basket_end
        description: Last day the basket prices, the day before the next one starts; empty for the latest basket.
      - name: segment_id
      - name: model
      - name: storage_gb
      - name: segment_condition
      - name: ref_start
        description: First day of the reference period the basket is chosen from (the base period, or the month before).
      - name: ref_end
        description: Last day of the reference period.
      - name: ref_days
        description: Days of the reference period with data.
      - name: final
        description: The reference period's days are out of the lookback window, so the basket no longer changes.
      - name: days_priced
        description: Reference days the segment had in-stock offers.
      - name: avg_offers
        description: Offers a day on those days.
      - name: ref_offers
        description: Offers over the reference period.
      - name: weight
        description: Share of the reference period's offers within the basket; sums to 1 per platform and basket.
      - name: ref_price_tl
        description: >
          Median of the segment's daily median prices over the reference period; the day's median divided by it is
          the segment's price relative.
      - name: ref_price_usd

  - name: price_index
    description: >
      Refurbished iPhone price index (plan 10.3): 100 = the base period's prices, in lira and in dollars. Each day is
      priced with the basket in effect on it (`price_index_basket`) and chain linked to the day before over the
      segments priced on both days, both measured with that day's basket. So a missing segment neither breaks nor
      biases the series, and a new month's basket carries the index on from the day before it. Not age adjusted: the basket's devices age, so the index also falls by depreciation (the
      age-adjusted hedonic index comes with the model in Phase 3).
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, platform]
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: platform
      - name: index_tl
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: index_tl > 0
      - name: index_usd
        data_tests: [not_null]
      - name: segments_priced
        description: Segments of the day's basket with in-stock offers that day.
      - name: segments_matched
        description: Of them, those priced on the previous day too; the day's change is measured on these. Empty on the first day.
      - name: basket_segments
        description: Segments in the day's basket.
      - name: weight_priced
        description: Basket weight priced that day; a low value (a short run) makes the day less reliable.
      - name: link_tl
        description: Change from the previous day over the matched segments (1 = unchanged).
      - name: link_usd
      - name: base_start
        description: First day of the base period (100), var index_base_start.
      - name: base_end
      - name: basket_final
        description: The day's basket no longer changes (see price_index_basket.final).
      - name: basket_checksum
        description: Fingerprint of all the baskets the day was computed with.
      - name: fx_confirmed
        description: The dollar figures use final TCMB rates.
      - name: computed_at
