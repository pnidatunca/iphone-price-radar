name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked --group app --group report  # Streamlit for the Market page, matplotlib for the charts
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  dbt:
    # The dbt project on a throwaway PostgreSQL 18 (Neon's version) with synthetic offers: two incremental builds, the
    # figures they give, and a full rebuild that must give the same marts (tests/test_dbt_models.py). No secret is used.
    # The documentation site is built from the same server, so it names no production database or role.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RADAR_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked --group report  # the charts are drawn from the analyses of the test database
      - name: dbt models
        run: uv run pytest -q tests/test_dbt_models.py
      - name: dbt docs
        # One self-contained page (static_index.html). Before anything is published, every generated file is checked:
        # no Neon host, database, role or password, no connection string, and no database or owner name but the
        # throwaway server's "postgres". The page holds model and column descriptions and SQL, no data rows.
        env:
          NEON_DATABASE_URL: ${{ env.RADAR_TEST_DATABASE_URL }}
        run: |
          uv run python -m price_radar.transform.runner docs
          uv run python -m price_radar.transform.runner check-docs --allow postgres \
            dbt/target/static_index.html dbt/target/manifest.json dbt/target/catalog.json
          mkdir -p "$RUNNER_TEMP/site"
          cp dbt/target/static_index.html "$RUNNER_TEMP/site/index.html"
      - name: Is GitHub Pages set to deploy from Actions?
        # Pushes to main publish the site once the repository's Pages source is "GitHub Actions"; until then nothing
        # is uploaded and the deploy job is skipped.
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 until Pages is enabled; gh then prints the error body, which is dropped
          if ! source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null); then source=none; fi
          echo "publish=$([ "$source" = workflow ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "::notice title=dbt docs::GitHub Pages source: $source"
      - name: Upload the site
        if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  docs:
    # The dbt documentation on GitHub Pages (decision of 4.11.2026).
    needs: dbt
    if: needs.dbt.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
