name: trial-crawl

# Phase 0 trial crawl (decisions K13 and K19): one full run per source per day. Offers go straight to Neon's
# raw.landing table; nothing is uploaded as an artifact and the job summary holds counts and timings only.

on:
  schedule:
    # GitHub delays or drops scheduled runs at busy times; the 00:17 UTC slot was skipped on 13.10.2026. Run at
    # 04:47 Turkey time (UTC+3), with a fallback at 08:47 that does nothing if that day's run is already loaded.
    - cron: "47 1 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      max_requests:
        description: Request budget per source, robots.txt included
        type: number
        default: 1500

permissions:
  contents: read

concurrency:
  group: trial-crawl
  cancel-in-progress: false

jobs:
  crawl:
    strategy:
      fail-fast: false
      matrix:
        # Easycep was dropped on 14.10.2026: its terms of use forbid crawlers and bulk access to its listings.
        source: [getmobil]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SOURCE: ${{ matrix.source }}
      MAX_REQUESTS: ${{ inputs.max_requests || 1500 }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Skip if today's run is already loaded
        id: guard
        # Scheduled runs only; a manual run always crawls. If the database cannot be asked, the crawl runs anyway.
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: echo "skip=$(uv run python -m price_radar.storage.landing loaded-today --source "$SOURCE")" >> "$GITHUB_OUTPUT"
      - name: Crawl
        id: crawl
        if: steps.guard.outputs.skip != 'true'
        run: |
          args=(--source "$SOURCE" --max-requests "$MAX_REQUESTS" --out "$RUNNER_TEMP/run" --markdown)
          set +e
          uv run python -m price_radar.ingest.run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # A run cut short by its request budget exits 0 but is incomplete; make that visible.
          reason=$(jq -r '.stop_reason // "missing"' "$RUNNER_TEMP/run/run_summary.json" 2>/dev/null || echo missing)
          if [ "$reason" != "completed" ]; then echo "::warning title=Incomplete $SOURCE run::$reason"; fi
          exit "$code"
      - name: Load into Neon
        # Also after a failed crawl: the summary (and any offers collected before the stop) is still worth keeping.
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          EXIT_CODE: ${{ steps.crawl.outputs.exit_code }}
        run: |
          if [ ! -f "$RUNNER_TEMP/run/run_summary.json" ]; then echo "no run summary, nothing to load"; exit 0; fi
          args=(--run-dir "$RUNNER_TEMP/run" --run-id "$RUN_ID")
          if [ -n "$EXIT_CODE" ]; then args+=(--exit-code "$EXIT_CODE"); fi
          uv run python -m price_radar.storage.landing load "${args[@]}"
      - name: Database size
        # raw.landing has no retention until Phase 1; warn at 70% of Neon's free storage.
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: uv run python -m price_radar.storage.landing db-size --warn-mb 350 | tee -a "$GITHUB_STEP_SUMMARY"
