name: daily-pipeline

# Phase 1 nightly data pipeline (plan 6.1): one full run per source per day, loaded into Neon's raw.offer_snapshots
# (the payload only when an offer changed), raw.rejected_offers and ops.pipeline_runs. Nothing is uploaded as an
# artifact and the job summary holds counts and timings only (K12, K19). It replaced the Phase 0 trial-crawl workflow
# on 20.10.2026.

on:
  schedule:
    # GitHub delays or drops scheduled runs at busy times; the 00:17 UTC slot was skipped on 13.10.2026. Run at
    # 04:47 Turkey time (UTC+3), with a fallback at 08:47 that does nothing if that day's run is already loaded.
    - cron: "47 1 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Source to crawl ("nightly" is the set the schedule crawls)
        type: choice
        options: [nightly, getmobil]
        default: nightly
      max_requests:
        description: Request budget per source, robots.txt included
        type: number
        default: 1500

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  crawl:
    strategy:
      fail-fast: false
      matrix:
        # The nightly set is Getmobil; a manual run can crawl one source instead. Easycep (14.10.2026) and Trendyol
        # (19.10.2026) were dropped; see config/settings.yaml.
        source: ${{ fromJSON(inputs.source && inputs.source != 'nightly' && format('["{0}"]', inputs.source) || '["getmobil"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SOURCE: ${{ matrix.source }}
      MAX_REQUESTS: ${{ inputs.max_requests || 1500 }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.source }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Skip if today's run is already loaded
        id: guard
        # Scheduled runs only; a manual run always crawls. If the database cannot be asked, the crawl runs anyway.
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: echo "skip=$(uv run python -m price_radar.storage.snapshots loaded-today --source "$SOURCE")" >> "$GITHUB_OUTPUT"
      - name: Recently seen variants
        # Listing drift: a model listing that stays incomplete after its re-read is completed with the variants seen
        # on the last 7 days. Without the list (a database hiccup) the crawl runs as before.
        if: steps.guard.outputs.skip != 'true' && matrix.source == 'getmobil'
        continue-on-error: true
        run: uv run python -m price_radar.storage.snapshots recent-variants --source "$SOURCE" --days 7 --out "$RUNNER_TEMP/recent-variants.jsonl"
      - name: Crawl
        id: crawl
        if: steps.guard.outputs.skip != 'true'
        run: |
          args=(--source "$SOURCE" --max-requests "$MAX_REQUESTS" --out "$RUNNER_TEMP/run" --markdown)
          if [ -s "$RUNNER_TEMP/recent-variants.jsonl" ]; then args+=(--recent-variants "$RUNNER_TEMP/recent-variants.jsonl"); fi
          set +e
          uv run python -m price_radar.ingest.run "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # A run cut short by its request budget exits 0 but is incomplete; make that visible.
          reason=$(jq -r '.stop_reason // "missing"' "$RUNNER_TEMP/run/run_summary.json" 2>/dev/null || echo missing)
          if [ "$reason" != "completed" ]; then echo "::warning title=Incomplete $SOURCE run::$reason"; fi
          # Counts as an annotation: annotations can be read through the API where job logs cannot.
          result=$(jq -r '"\(.offers) offers, \(.requests.made) requests, \(.warnings.count) warnings, \(.failures.count) failures"' \
            "$RUNNER_TEMP/run/run_summary.json" 2>/dev/null || echo "no run summary")
          echo "::notice title=$SOURCE run (exit $code)::$result"
          exit "$code"
      - name: Load into Neon
        # Also after a failed crawl: the summary (and any offers collected before the stop) is still worth keeping.
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          EXIT_CODE: ${{ steps.crawl.outputs.exit_code }}
        run: |
          if [ ! -f "$RUNNER_TEMP/run/run_summary.json" ]; then echo "no run summary, nothing to load"; exit 0; fi
          args=(--run-dir "$RUNNER_TEMP/run" --run-id "$RUN_ID" --workflow daily-pipeline)
          if [ -n "$EXIT_CODE" ]; then args+=(--exit-code "$EXIT_CODE"); fi
          uv run python -m price_radar.storage.snapshots load "${args[@]}"
      - name: Database size
        # No retention yet (it starts with the summary tables of Phase 2); warn at 70% of Neon's free storage.
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: uv run python -m price_radar.storage.snapshots db-size --warn-mb 350 | tee -a "$GITHUB_STEP_SUMMARY"
