name: ref-devices

# The device reference table ref.devices (plan 5.5) from dbt/seeds/devices.csv, until dbt seed takes it over in
# Phase 2, and a check that every model and storage size seen in raw.offer_snapshots has a row in it.

on:
  push:
    branches: [main]
    paths: [dbt/seeds/devices.csv]
  schedule:
    - cron: "7 4 * * 1"  # Mondays 07:07 Turkey time: a model that appeared during the week is reported
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ref-devices
  cancel-in-progress: false

jobs:
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Load ref.devices
        run: uv run python -m price_radar.storage.devices load
      - name: Check the models seen
        # An unknown model turns the job red; unknown models and sizes go to Telegram.
        run: |
          uv run python -m price_radar.storage.devices check --summary "$GITHUB_STEP_SUMMARY" --annotate \
            --notify problems
