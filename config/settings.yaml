# Non-secret settings. Secrets come from environment variables (see .env.example).

crawler:
  # Honest identity (decision K5): project name and a link to the notice for site owners in the README.
  # robots.txt groups addressed to the product token "IphonePriceRadar" are honoured.
  user_agent: "IphonePriceRadar/0.1 (+https://github.com/pnidatunca/iphone-price-radar#for-site-owners)"
  delay_seconds: [2.0, 3.5]      # random gap after each response before the next request to the same site
  # Per run. Phase 0 measured 6-9 s per response, so with the gap 1,500 requests take about 3.5-5 hours;
  # a full Getmobil run needs about 805 requests (about 2-2.7 hours).
  max_requests_per_source: 1500
  max_consecutive_errors: 10     # the source is stopped for the run after this many errors in a row
  max_retry_after_seconds: 60    # a longer Retry-After stops the source for the run instead of waiting
  timeout_seconds: 25

scope:
  # Decision K21: iPhone X and newer, including iPhone SE (2020) and SE (2022). Older models are not collected.
  excluded_models:
    - iPhone 5
    - iPhone 5c
    - iPhone 5s
    - iPhone SE (2016)
    - iPhone 6
    - iPhone 6 Plus
    - iPhone 6s
    - iPhone 6s Plus
    - iPhone 7
    - iPhone 7 Plus
    - iPhone 8
    - iPhone 8 Plus

sources:
  getmobil:
    enabled: true
    base_url: "https://getmobil.com"
  easycep:
    enabled: true
    base_url: "https://easycep.com"

retention:
  detail_days: 90
  score_days: 30
  rejected_days: 30
  ops_days: 180

model:
  target: log_price_usd
  train_window_days: 90          # total window including the test week
  test_window_days: 7
  calibration_share: 0.2         # last 20% of the pre-test period, used for conformal calibration
  valuation_coverage: 0.80
  deal_coverage: 0.95
  deal_min_discount: 0.08        # starting value; tuned with precision@20 labels
  promote_min_improvement: 0.02  # challenger needs at least 2% relative MAPE improvement
